[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-report-gen"
version = "0.3.2"
description = "Minimal wrapper over python-docx and math2docx for generating docx reports"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "math2docx>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "typing-extensions>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docx_report_gen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that are noticeably slower",
]

[tool.coverage.run]
source = ["src/docx_report_gen"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/docx_report_gen"]
disallow_untyped_calls = false
explicit_package_bases = true